{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>セグメント木ビジュアライザ</title>
    <link rel="stylesheet" href="{% static 'web_segmenttree/style.css' %}">
  </head>
  <body>
    <h1>セグメント木ビジュアライザ</h1>
    <p>配列をカンマ区切りで入力して「Build」を押してください。</p>
    <input id="arrayInput" value="1,3,5,7,9,11">
    <button id="buildBtn">Build</button>
    <button id="randomBtn">Random</button>
    <div id="function">
        <input type="radio" id="func_type_sum" name="func_type" value="sum" checked><label for="func_type_sum">sum</label>
        <input type="radio" id="func_type_max" name="func_type" value="max"><label for="func_type_max">max</label>
        <input type="radio" id="func_type_min" name="func_type" value="min"><label for="func_type_min">min</label>
    </div>
    <div style="margin-top:1rem">
      <label>Update index: <input id="updIndex" type="number" value="0" style="width:4rem"></label>
      <label>Value: <input id="updValue" type="number" value="0" style="width:4rem"></label>
      <button id="updBtn">Update</button>
    </div>
    <div id="svgContainer" style="margin-top:1rem"></div>

    <script src="{% static 'web_segmenttree/segmenttree.js' %}"></script>
    <a href="/">ホームへ</a>
  </body>
</html>
